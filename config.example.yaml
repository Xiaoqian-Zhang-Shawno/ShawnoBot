app:
  command_prefix: "/"
  data_dir: "./data"
  audit_log: "./data/audit.jsonl"
  max_reply_chars: 6000

feishu:
  # Credentials belong in .env, never in this YAML file.
  require_mention_in_group: true
  # Deny by default: add your own Feishu open_id after the first local lookup.
  allowed_user_ids:
    - "ou_replace_with_your_open_id"
  # Group messages require both an allowed user and an allowed chat.
  allowed_chat_ids:
    - "oc_replace_with_your_group_chat_id"

limits:
  command_timeout_seconds: 120
  codex_timeout_seconds: 900
  max_log_lines: 300
  max_codex_prompt_chars: 8000
  max_parallel_codex_runs: 1
  max_parallel_tasks: 2

codex:
  # Keep disabled until Feishu authorization has been verified.
  enabled: false
  executable: "codex"
  # Start with read-only. Use workspace-write only for trusted, versioned projects.
  sandbox: "read-only"
  model: null
  natural_language_enabled: false
  default_project: "demo"

nlu:
  # DeepSeek acts only as a translator. Its output is validated and never sent
  # directly to the user.
  enabled: false
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-pro"
  timeout_seconds: 15
  min_confidence: 0.85
  max_input_chars: 2000
  max_output_tokens: 300
  allowed_commands:
    - help
    - projects
    - project-new
    - project-allow
    - host
    - gpu
    - status
    - log
    - task
    - jobs
    - joblog
    - stop
    - codex-status
    - codex-cancel
    - new
    - context
    - usage
    - sessions
    - session-new
    - session
    - desktop
    - desktop-projects
    - desktop-send
    - watch
    - watches
    - unwatch

management:
  # When enabled, remote project registration is still constrained to these roots.
  remote_registration_enabled: false
  allowed_project_roots:
    - "D:/projects"

sessions:
  example_session:
    id: "00000000-0000-4000-8000-000000000000"
    title: "Example allowlisted Codex session"
    project: "demo"

projects:
  demo:
    path: "C:/path/to/your/project"
    description: "Example project"
    codex_enabled: false
    logs:
      train: "logs/train.log"
      error: "logs/error.log"
    tasks:
      test:
        description: "Run project tests"
        cwd: "."
        argv: ["python", "-m", "pytest", "-q"]
        background: false
        timeout_seconds: 300
      train:
        description: "Start training in the background"
        cwd: "."
        argv: ["python", "train.py"]
        background: true
        timeout_seconds: 0
